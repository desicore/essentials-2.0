    - heading "Access, roles & sharing" [level=1] [ref=e5]
    - paragraph [ref=e6]: "Internal board for the Essentials 2.0 solution concept. Not about UI: each reference shows how another product solves an access, role or sharing problem our customers actually have (learners without logins, faculty that cannot be scoped to their own students, rosters living in Canvas, eight global roles nobody needs, recordings that should open and close on dates). One section per question; every card says what we would take from it. Counter-examples are flagged. Raw material from Mobbin and Refero, to be cut down before anything is shown outside the team."
