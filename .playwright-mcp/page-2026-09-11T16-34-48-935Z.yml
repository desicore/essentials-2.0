      - 'heading "Composer: audience targeting (course / group / individual), attachment of course materials, scheduling" [level=2] [ref=e249]'
    - paragraph [ref=e250]: "Every composer in the set treats scheduling as a property of the send action, not a separate feature: Slack's send-button dropdown with presets and a custom date/time (mobbin:fd356e91), Whop's inline calendar popover (mobbin:16eb85ed), LinkedIn's clock icon (refero:863), Basecamp's 'Schedule and save' (mobbin:25c42c82). Audience targeting is rarer and coarser than the question assumes: Google Classroom puts a 'For / All students' dropdown directly above the text box (refero:19605564), Teachable offers everyone / a course / an individual (refero:9617), The Leap uses described segments (refero:4564), and Confluence only Public/Private plus a start–end window (mobbin:fcc604e7). Attachments are inline uploads (ClassDojo photo, Basecamp PDF, Whop image); nobody attaches from a course library. Only The Leap closes the loop from recipients through confirmation to open/click stats. Confluence's one-active-banner cap is the caveat: a persistent materials banner and a timely one cannot coexist."
