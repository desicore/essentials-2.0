    - heading "What the best apps do differently" [level=3] [ref=e147]
    - list [ref=e148]:
      - listitem [ref=e149]:
        - strong [ref=e150]: They separate visibility from notification.
        - text: Basecamp asks "who should see this?" and, separately, "when I post this, notify…" (
        - code [ref=e151]: mobbin:0bc24c79
        - text: ); beehiiv reconciles channels into a per-channel recipient count before Send (
        - code [ref=e152]: mobbin:748e794e
        - text: ). Substack collapses email and push into one default-on toggle (
        - code [ref=e153]: mobbin:a7ebc4ec
        - text: ), the simplest version of the same idea. Nobody in the set exposes an LMS as a channel inside the composer.
      - listitem [ref=e154]:
        - strong [ref=e155]: Scheduling is a property of the send button, not a feature.
        - text: Slack's send dropdown with presets (
        - code [ref=e156]: mobbin:fd356e91
        - text: ), Whop's inline popover (
        - code [ref=e157]: mobbin:16eb85ed
        - text: ), Kit's send-time field that defaults to now (
        - code [ref=e158]: mobbin:f722d4bb
        - text: ), LinkedIn's clock icon (
        - code [ref=e159]: refero:863
        - text: ). Only Confluence adds an end date (
        - code [ref=e160]: mobbin:fcc604e7
        - text: ), the closest thing to "show this until the session".
      - listitem [ref=e161]:
        - strong [ref=e162]: Audience targeting is coarser than expected.
        - text: Google Classroom offers "All students" or a selection (
        - code [ref=e163]: refero:19605564
        - text: ), Teachable everyone / course / individual (
        - code [ref=e164]: refero:9617
        - text: ), The Leap named segments (
        - code [ref=e165]: refero:4564
        - text: ). ClassDojo has no audience control at all because the class is the audience (
        - code [ref=e166]: mobbin:53e9bdad
        - text: ).
      - listitem [ref=e167]:
        - strong [ref=e168]: Feedback only matters when it is per person and has an action next to it.
        - text: Navan selects non-responders and reminds them from the same table (
        - code [ref=e169]: mobbin:9d8af34f
        - text: ); Superhuman shows who opened, on which device, when, inline on the thread (
        - code [ref=e170]: mobbin:ba56c2de
        - text: ); HoneyBook branches the follow-up on "viewed within 1 day" (
        - code [ref=e171]: mobbin:8afb0d65
        - text: ); Docusign configures reminder cadence (
        - code [ref=e172]: mobbin:e4a526c1
        - text: ). Aggregate dashboards (HubSpot
        - code [ref=e173]: mobbin:5814d24c
        - text: ", Dub"
        - code [ref=e174]: refero:2fe44823
        - text: ) and Square's empty "Seen by" column (
        - code [ref=e175]: mobbin:1c8c3422
        - text: ) give a course manager nothing to act on.
      - listitem [ref=e176]:
        - strong [ref=e177]: Link controls converge on one panel with five questions.
        - text: "Who can open, at what level, until when, with which password, how to revoke: Mural ("
        - code [ref=e178]: mobbin:836e980f
        - text: ), Proton (
        - code [ref=e179]: mobbin:ef4fcd7f
        - text: ), Notion with relative presets resolved to a date (
        - code [ref=e180]: mobbin:cfca14fb
        - text: ). Loom is the only one that puts view tracking beside the share (
        - code [ref=e181]: refero:1242
        - text: ). ClickUp (
        - code [ref=e182]: mobbin:7f248abd
        - text: ") is the counter-example: expiry defaults to Never, no level, revoke is Unpublish."
      - listitem [ref=e183]:
        - strong [ref=e184]: The LMS hand-off maps to a specific class and confirms.
        - text: SchoolAI is the only complete example (
        - code [ref=e185]: mobbin:3135010e
        - text: ). Course platforms treat publishing as the send and never hand off (Kajabi
        - code [ref=e186]: mobbin:9aa981d2
        - text: ); generic connectors stop at authorization (Craft
        - code [ref=e187]: mobbin:e9079303
        - text: ", Cofounder"
        - code [ref=e188]: mobbin:7897406d
        - text: ", counter-example)."
      - listitem [ref=e189]:
        - strong [ref=e190]: On the learner side, announcements get their own type or place.
        - text: Teams' "Announcement" post type (
        - code [ref=e191]: mobbin:88ad5199
        - text: ), Circle's separate Announcements space (
        - code [ref=e192]: mobbin:c1b1c3ad
        - text: ), ClassDojo's teacher-only Pin (
        - code [ref=e193]: mobbin:3edf67a5
        - text: ); unread state aggregated centrally in Slack Activity (
        - code [ref=e194]: mobbin:8e65f9c9
        - text: ); channel preference per category in Spotify (
        - code [ref=e195]: refero:471b8f0c
        - text: ). Coursera's undifferentiated Latest list is the counter-example (
        - code [ref=e196]: mobbin:36db9592
        - text: ).
    - heading "Best practices top companies converge on" [level=3] [ref=e197]
    - list [ref=e198]:
      - listitem [ref=e199]: One composer for announcements and material sends; the post in the portal is the record, channels (email, push, link, LMS) are how people hear about it.
      - listitem [ref=e200]: "Ask two questions, not one: who can see this (course / group / individuals) and who gets notified now."
      - listitem [ref=e201]: Put "send now / schedule" on the send button with presets; add an optional end date for time-boxed material.
      - listitem [ref=e202]: Attach materials by reference from the course library, not by re-upload (no product in the set does this; it is the gap Essentials can fill).
      - listitem [ref=e203]: "Give the shareable link one panel: who, level, expiry (relative presets resolved to a date), password, revoke; show opens next to the link."
      - listitem [ref=e204]: Report delivery per person with an action beside it (remind non-openers, optionally automatic before the session); aggregate counts are secondary.
      - listitem [ref=e205]: "For the LMS hand-off: say what will be sent, map to one specific course, confirm with a toast, and keep the link back."
      - listitem [ref=e206]: "On the learner side: a distinct announcement type, pinnable, with attachments and replies inline, and a central unread inbox that agrees with email."
    - heading "Open questions for Essentials 2.0" [level=3] [ref=e207]
    - list [ref=e208]:
      - listitem [ref=e209]:
        - strong [ref=e210]: Audience unit.
        - text: The set targets by segment or course. For a simulation course the natural units are the course roster, the learner groups from sub-module 04, and the session cohort from 06; faculty and observers are a fourth audience nobody in the set models.
      - listitem [ref=e211]:
        - strong [ref=e212]: Materials by reference.
        - text: Every composer uploads. If materials live in sub-module 02, an announcement should link to the library item, inherit its access, and show whether it is already released; no reference shows this.
      - listitem [ref=e213]:
        - strong [ref=e214]: Portal as source of truth.
        - text: If the Learner Portal feed is the record, email and push are notifications of the same post, and the shareable link is a login-free view of it. That ties directly to the access-sharing module (magic links, time-boxed access); the link controls in Q3 should reuse those rules rather than add a second permission system.
      - listitem [ref=e215]:
        - strong [ref=e216]: Canvas hand-off object.
        - text: SchoolAI sends a document to one class. For Canvas the open questions are what object is created (announcement, module item, or a link back to the portal), how an Essentials course maps to a Canvas course when they differ, what happens on edit after send, and whether the learner then has two places to look. No reference shows edit-after-send or re-sync.
      - listitem [ref=e217]:
        - strong [ref=e218]: "\"Seen\" in education."
        - text: Superhuman-style per-person opens are useful before a simulation (did they read the pre-brief?) but may feel like surveillance to learners. Whether reminders are manual (Navan) or automatic before the session (Docusign / HoneyBook) is a product decision, not a pattern the set settles.
      - listitem [ref=e219]:
        - strong [ref=e220]: Scheduling against the session.
        - text: Products schedule by date/time. Essentials could schedule relative to a session ("two days before", "after debrief"), which none of the references model.
