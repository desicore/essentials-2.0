  - region [ref=e792]:
    - generic [ref=e793]:
      - generic [ref=e794]: Q4
      - heading "Delivery feedback (sent / delivered / seen, reminders)" [level=2] [ref=e795]
    - paragraph [ref=e796]: "Feedback is worth having only when it is per person and has an action next to it. Navan lists each invitee with a status, lets you select the non-responders and 'Send a reminder' from the same table (mobbin:9d8af34f); Superhuman shows per-person, per-device, timestamped opens inline on the thread itself (mobbin:ba56c2de). Automation goes further: HoneyBook branches the follow-up on 'file viewed within 1 day' (mobbin:8afb0d65); Docusign lets you set the days before the first reminder and the repeat interval (mobbin:e4a526c1). Newsletter tools lead with aggregate counters (Mailchimp mobbin:6db18da5, HubSpot mobbin:5814d24c; Dub for link clicks, refero:2fe44823) and keep per-recipient detail one tab away (Outseta's Recipients tab with last-opened timestamps, mobbin:34451b74). WhatsApp's Delivered / Read is the minimum: two states, one recipient (mobbin:5580e66f). Square's Announcements list is the caution (mobbin:1c8c3422): a 'Seen by' column that shows nothing and offers no follow-up action."
