  - region [ref=e991]:
    - generic [ref=e992]:
      - generic [ref=e993]: Q5
      - heading "External LMS hand-off UX (auth, mapping to course, what is sent, confirmation)" [level=2] [ref=e994]
    - paragraph [ref=e995]: "The thinnest question in the set and the most important one for Essentials. Only SchoolAI shows a complete hand-off (mobbin:3135010e): an Export menu that lists Google Classroom next to Docs / PDF, a permission modal that says what will be shared, an OAuth enable step, a Class picker that maps the document to one specific class, and an 'Exported to Google Classroom!' toast. Course platforms in the set have no hand-off at all: in Kajabi, publishing inside the product is the send, so the learner-facing surface is the product's own portal (mobbin:9aa981d2). Generic connectors stop at authorization: Craft is a Connect / Disconnect toggle on a settings page (mobbin:e9079303), and Cofounder's OAuth flow with per-scope toggles never reaches a 'what was sent' or success state (mobbin:7897406d, counter-example). Nobody shows editing or re-syncing after the hand-off."
