  - region [ref=e527]:
    - generic [ref=e528]:
      - generic [ref=e529]: Q2
      - heading "Channel choice (in-app feed, email, push, link, external LMS) and whether it is one composer or many features" [level=2] [ref=e530]
    - paragraph [ref=e531]: "Two models. 'One composer, many channels' puts the channel as a control on the same post: beehiiv's Post / Email / Website / Delivery tabs reconcile into a per-channel recipient summary before sending (mobbin:748e794e); Kit layers a 'Publish to web' opt-in over a default email send (mobbin:f722d4bb); Intercom folds platform (web / iOS / Android) and push into one panel (mobbin:7380bc5c). 'Implicit channel' treats the in-app post as the channel and only asks who is notified: Basecamp separates 'who should see this' from 'when I post this, notify…' (mobbin:0bc24c79), and Substack bundles email and push into a single default-on 'notify subscribers' toggle (mobbin:a7ebc4ec). Nobody in the set exposes an external LMS as a channel inside the composer; that lives in an export menu (see Q5). The useful distinction for a course is visibility versus notification: the post is the record, the channels are how people hear about it."
