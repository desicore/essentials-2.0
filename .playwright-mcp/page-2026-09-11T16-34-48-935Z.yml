  - region [ref=e604]:
    - generic [ref=e605]:
      - generic [ref=e606]: Q3
      - heading "Shareable link controls (expiry, access level, revoke, tracking)" [level=2] [ref=e607]
    - paragraph [ref=e608]: "Link controls converge on one panel with five questions: who can open (anyone / workspace / specific people), at what level (view / comment / edit), until when, with which password, and how to revoke. Mural shows all five, including a timezone-stamped expiry and a 'Reset visitor link' that regenerates rather than merely disables (mobbin:836e980f); Proton has expiry, password and 'Stop sharing' (mobbin:ef4fcd7f); Notion resolves relative presets ('in a week') to an absolute date inline and ends with a red Remove (mobbin:cfca14fb). Coda (mobbin:c333ff8e), Dropbox (mobbin:777c4ef0) and Sketch (mobbin:1fb17c11) focus on tiered access (workspace / guests / everyone) and per-person levels, with Copy link always in the same corner; Sketch splits public rights into download versus comment checkboxes. Only Loom shows tracking next to the share ('No views yet', refero:1242). ClickUp is the counter-example (mobbin:7f248abd): expiry defaults to Never with no presets, no access level, and the only revoke is an all-or-nothing Unpublish."
    - paragraph [ref=e609]: 8 of 8 references
