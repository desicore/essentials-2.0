- main [ref=e2]:
  - generic [ref=e3]:
    - generic [ref=e4]: Essentials 2.0 · Design research · 09-announcements-send-materials
    - heading "Announcements / Send learning materials or send to Canvas → Shareable link" [level=1] [ref=e5]
    - paragraph [ref=e6]: "Internal board for the Essentials 2.0 solution concept (Semester → Courses → Announcements / send materials → Shareable link). Not about UI: each reference shows how another product lets someone running a course communicate from inside it: announce to everyone or a group, send selected files or links ahead of a session, choose the channel (portal feed, email, shareable link, Canvas LMS), schedule it, and see who received or opened it. One section per question; every card says what we would take from it. Counter-examples are flagged. Raw material from Mobbin and Refero, to be cut down in the converge pass before anything is shown outside the team."
  - region [ref=e7]:
    - heading "Synthesis" [level=2] [ref=e8]
    - paragraph [ref=e9]:
      - text: Read this first. Sections Q1–Q6 below hold the evidence cards; every product and reference id named here is in the report. Ids are shortened to their first block (for example
      - code [ref=e10]: mobbin:3135010e
      - text: ).
    - heading "Top examples" [level=3] [ref=e11]
    - list [ref=e12]:
      - listitem [ref=e13]:
        - strong [ref=e14]: The Leap
        - text: (Refero,
        - code [ref=e15]: refero:4564
        - text: ") — one flow from recipient segment to confirmation to live open/click stats: the whole loop a course announcement needs, in eight steps."
      - listitem [ref=e16]:
        - strong [ref=e17]: Google Classroom
        - text: (Refero,
        - code [ref=e18]: refero:19605564
        - text: ) — the audience dropdown ("For · All students") sits on the composer itself; the canonical LMS composer.
      - listitem [ref=e19]:
        - strong [ref=e20]: beehiiv
        - text: (Mobbin,
        - code [ref=e21]: mobbin:748e794e
        - text: ) — one post object with Post / Email / Website tabs and a per-channel recipient summary before Send.
      - listitem [ref=e22]:
        - strong [ref=e23]: Basecamp
        - text: (Mobbin,
        - code [ref=e24]: mobbin:0bc24c79
        - text: ) — separates "who should see this" from "who gets notified" inside one composer.
      - listitem [ref=e25]:
        - strong [ref=e26]: Mural
        - text: (Mobbin,
        - code [ref=e27]: mobbin:836e980f
        - text: ) — a single access panel with access level, visitor-link level, password, timezone-stamped expiry and Reset link.
      - listitem [ref=e28]:
        - strong [ref=e29]: Navan
        - text: (Mobbin,
        - code [ref=e30]: mobbin:9d8af34f
        - text: ) — per-person status table where you select the non-responders and "Send a reminder" without leaving it.
      - listitem [ref=e31]:
        - strong [ref=e32]: SchoolAI
        - text: (Mobbin,
        - code [ref=e33]: mobbin:3135010e
        - text: ") — the only complete LMS hand-off: Export → permission → class picker → \"Exported to Google Classroom!\"."
      - listitem [ref=e34]:
        - strong [ref=e35]: Microsoft Teams
        - text: (Mobbin,
        - code [ref=e36]: mobbin:88ad5199
        - text: ) — "Announcement" is a distinct post type with a bold title and replies attached; learners can tell it from chatter.
