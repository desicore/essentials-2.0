  - region [ref=e1115]:
    - generic [ref=e1116]:
      - generic [ref=e1117]: Q6
      - heading "Learner-side reception (feed, notification, email) and consistency with the portal" [level=2] [ref=e1118]
    - paragraph [ref=e1119]: "The consistent products give announcements a distinct type or place on the learner side. Microsoft Teams offers 'Post' versus 'Announcement' in the composer and renders announcements with a bold title and replies attached (mobbin:88ad5199); Circle routes them to an 'Announcements' space separate from the feed (mobbin:c1b1c3ad); ClassDojo keeps a teacher-only Pin so the post stays on top, with the attachment and replies inline (mobbin:3edf67a5). Unread state is aggregated centrally in Slack's Activity screen rather than only inside the source channel (mobbin:8e65f9c9), and Spotify lets the recipient choose email versus push per category, a model for learner notification preferences (refero:471b8f0c). Coursera is the counter-example (mobbin:36db9592): instructor content sits in a 'Latest'-sorted Q&A list with no pin, no unread marker and no sender role, so an announcement is indistinguishable from peer chatter."
